<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员 - 数智实训平台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<script src="/static/js/api.js"></script>
<style>
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#09090B}
.card{background:#131316;border-radius:16px;border:1px solid rgba(255,255,255,0.10)}
</style>
</head>
<body class="h-screen flex">

<!-- 背景粒子场（Canvas，纯装饰层，引擎见 static/js/particles.js） -->
<canvas aria-hidden="true" id="dt-particles" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;"></canvas>

<!-- SIDEBAR -->
<aside class="w-64 bg-zinc-900 border-r border-white/10 flex flex-col h-full">
  <div class="p-5 border-b border-white/10"><div class="font-bold text-zinc-50 tracking-tight">数智实训平台</div><div class="text-xs text-zinc-500">管理员面板</div></div>
  <div class="flex-1 overflow-y-auto p-4">
    <h3 class="text-xs font-bold text-zinc-500 uppercase mb-3">消息预览</h3>
    <div id="pending-list" class="space-y-2"></div>
  </div>
  <div class="p-4 border-t border-white/10"><div class="text-sm font-medium text-zinc-200" id="user-name"></div><button class="text-xs text-rose-400 mt-1 hover:text-rose-300" onclick="localStorage.clear();location.href='/'">退出</button></div>
</aside>

<!-- MAIN -->
<main class="flex-1 flex flex-col">
  <div class="bg-zinc-950/80 backdrop-blur-xl border-b border-white/10 px-6 py-3 flex gap-4">
    <button class="px-4 py-2 rounded-full text-sm font-semibold bg-lime-400 text-zinc-950" id="btn-courses" onclick="switchTab('courses')">课程管理</button>
    <button class="px-4 py-2 rounded-full text-sm font-semibold text-zinc-400" id="btn-teachers" onclick="switchTab('teachers')">教师管理</button>
  </div>
  <div class="flex-1 overflow-y-auto">
    <!-- Courses Tab -->
    <div id="tab-courses" class="p-6">
      <div class="flex gap-3 mb-6">
        <button class="px-4 py-2 bg-lime-400 text-zinc-950 rounded-full text-sm font-semibold hover:bg-lime-300 transition" onclick="showCreateCourse()">+ 创建课程</button>
        <button class="px-4 py-2 border border-white/15 bg-white/5 text-zinc-100 hover:bg-white/10 rounded-full text-sm font-semibold transition" onclick="showAiGenerate()"><iconify-icon icon="lucide:sparkles" class="mr-1 align-middle text-cyan-400"></iconify-icon>AI 生成课程</button>
      </div>
      <div id="courses-grid" class="grid grid-cols-3 gap-4"></div>
    </div>
    <!-- Teachers Tab -->
    <div id="tab-teachers" class="p-6 hidden">
      <input class="w-64 px-4 py-2.5 rounded-xl border border-white/10 bg-zinc-900 text-sm text-zinc-50 placeholder-zinc-500 outline-none transition focus:border-lime-400/60 focus:ring-2 focus:ring-lime-400/20 mb-4" placeholder="搜索工号..." id="teacher-search" oninput="loadTeachers()">
      <div id="teacher-list"></div>
    </div>
  </div>
</main>

<!-- Pending Detail Modal -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" id="modal-detail" onclick="document.getElementById('modal-detail').classList.add('hidden')">
  <div class="card w-full max-w-lg shadow-2xl" onclick="event.stopPropagation()">
    <div class="px-6 py-4 border-b border-white/10 flex justify-between"><h3 class="font-bold text-zinc-50" id="detail-name"></h3><button onclick="document.getElementById('modal-detail').classList.add('hidden')"><iconify-icon icon="lucide:x" class="text-xl text-zinc-500 hover:text-zinc-200"></iconify-icon></button></div>
    <div class="p-6"><p class="text-xs text-zinc-500 mb-3" id="detail-info"></p><p class="text-sm text-zinc-400" id="detail-desc"></p></div>
    <div class="px-6 py-4 border-t border-white/10 flex gap-3 justify-end"><button class="px-4 py-2 rounded-full bg-rose-500/15 text-rose-400 hover:bg-rose-500/25 text-sm" onclick="audit(0)">驳回</button><button class="px-4 py-2 rounded-full bg-lime-400 text-zinc-950 hover:bg-lime-300 text-sm font-semibold" onclick="audit(1)">通过</button></div>
  </div>
</div>

<script src="/static/js/particles.js"></script>
<script>
// 管理员面板背景粒子场：最克制的一档，避免干扰表格/待办列表
if (window.DTParticles) {
    DTParticles.init({ accent: '#BEF264', density: 1.0, linkDistance: 120, cursorRadius: 150, clickBurst: 8 });
}

var u=API.getCurrentUser();document.getElementById('user-name').innerText=(u||{}).display_name||'admin';
loadPending();loadCourses();

function switchTab(t){
  document.getElementById('tab-courses').classList.toggle('hidden',t!=='courses');
  document.getElementById('tab-teachers').classList.toggle('hidden',t!=='teachers');
  document.getElementById('btn-courses').className='px-4 py-2 rounded-full text-sm font-semibold '+(t==='courses'?'bg-lime-400 text-zinc-950':'text-zinc-400');
  document.getElementById('btn-teachers').className='px-4 py-2 rounded-full text-sm font-semibold '+(t==='teachers'?'bg-lime-400 text-zinc-950':'text-zinc-400');
  if(t==='teachers')loadTeachers();
}

// === PENDING ===
var pc={};
async function loadPending(){
  try{var r=await apiFetch('/courses/admin/pending');var cs=Array.isArray(r)?r:(r.courses||[]);
    var el=document.getElementById('pending-list');
    if(!cs.length){el.innerHTML='<p class="text-xs text-zinc-500">暂无待审核</p>';return}
    // 展示申请教师姓名 + 工号
    var h='';cs.forEach(function(c){h+='<div class="p-2 rounded-lg cursor-pointer hover:bg-rose-500/10 text-sm" onclick="showDetail('+c.id+')"><div class="font-medium text-zinc-200 truncate">'+c.name+'</div><div class="text-xs text-zinc-500">'+(c.teacher_name||'')+(c.teacher_no?' · 工号'+c.teacher_no:'')+'</div></div>'});
    el.innerHTML=h;
  }catch(e){}
}
var _dc={};
async function showDetail(cid){
  if(!_dc[cid]){var r=await apiFetch('/courses/admin/pending');(Array.isArray(r)?r:(r.courses||[])).forEach(function(c){_dc[c.id]=c});}
  var c=_dc[cid];if(!c)return;
  document.getElementById('detail-name').innerText=c.name;
  document.getElementById('detail-info').innerText=(c.course_code||'')+' | '+(c.teacher_name||'')+(c.teacher_no?'（工号'+c.teacher_no+'）':'')+' | '+c.subtask_count+'子任务';
  document.getElementById('detail-desc').innerText=c.description||'';
  document.getElementById('modal-detail').classList.remove('hidden');window._ac=cid;
}
async function audit(a){
  var cid=window._ac;if(!cid)return;
  await apiFetch((a?'/courses/admin/approve/':'/courses/admin/reject/')+cid,{method:'POST'});
  toast(a?'已通过审核，课程已全站公开':'已驳回公开申请','success');
  document.getElementById('modal-detail').classList.add('hidden');
  _dc={};loadPending();loadCourses();
}

// === COURSES ===
var colors=['from-lime-400 to-emerald-500','from-emerald-400 to-teal-500','from-cyan-400 to-teal-500','from-amber-400 to-orange-500','from-rose-400 to-pink-500','from-teal-400 to-cyan-500'];
async function loadCourses(){
  try{var r=await apiFetch('/courses');var cs=Array.isArray(r)?r:(r.courses||[]);
    var cols=['from-lime-400 to-emerald-500','from-emerald-400 to-teal-500','from-cyan-400 to-teal-500','from-amber-400 to-orange-500','from-rose-400 to-pink-500','from-teal-400 to-cyan-500'];
    var h='';cs.forEach(function(c,i){
      var col=cols[i%cols.length];
      h+='<div class="card p-6 cursor-pointer hover:border-lime-400/40 hover:bg-zinc-800/80 hover:-translate-y-1 transition-all duration-300" data-cid="'+c.id+'" data-cname="'+c.name.replace(/"/g,'quot;')+'"><div class="w-12 h-12 bg-gradient-to-br '+col+' rounded-xl flex items-center justify-center mb-3"><iconify-icon icon="lucide:book-open" class="text-white text-xl"></iconify-icon></div><div class="font-semibold text-sm text-zinc-50 mb-1">'+c.name+'</div><div class="text-xs text-zinc-500 font-mono">'+(c.course_code||'')+'</div><div class="flex gap-2 mt-3"><span class="px-2 py-0.5 rounded-full text-xs '+(c.subtask_count?'bg-lime-400/10 text-lime-300':'bg-white/5 text-zinc-400')+'">'+c.subtask_count+' 子任务</span><span class="px-2 py-0.5 rounded-full text-xs '+(c.is_public===1?'bg-emerald-400/10 text-emerald-400':(c.is_public===2?'bg-amber-400/10 text-amber-400':'bg-white/5 text-zinc-400'))+'">'+(c.is_public===1?'公开':(c.is_public===2?'待审核':'私有'))+'</span><button class="ml-auto px-2 py-0.5 rounded-full text-xs bg-rose-500/15 text-rose-400 hover:bg-rose-500/25 transition" onclick="event.stopPropagation();deleteCourse('+c.id+',this)"><iconify-icon icon="lucide:trash-2" class="align-middle"></iconify-icon> 删除</button></div></div>';
    });
    document.getElementById('courses-grid').innerHTML=h||'<p class="text-zinc-500 text-center py-12 col-span-3">暂无课程</p>';
    // Attach click handlers
    document.querySelectorAll('#courses-grid [data-cid]').forEach(function(el){
      el.onclick=function(){ showSubtasks(parseInt(this.dataset.cid)); };
    });
  }catch(e){}
}
async function showSubtasks(cid){
  var r=await apiFetch('/courses/'+cid+'/subtasks');var subs=Array.isArray(r)?r:(r.subtasks||[]);
  var modal=document.getElementById('modal-subtasks');
  var title=document.getElementById('subtasks-title');
  var body=document.getElementById('subtasks-body');
  if(!subs.length){title.innerText='子任务';body.innerHTML='<p class="text-zinc-500 text-center py-10">该课程暂无子任务</p>';modal.classList.remove('hidden');return}
  title.innerText='子任务 ('+subs.length+')';
  var h='';
  subs.forEach(function(s,i){
    h+='<div class="border border-white/10 rounded-xl p-4 mb-3">'
      +'<div class="flex items-start gap-2 mb-2"><span class="flex-none w-6 h-6 rounded-full bg-lime-400/15 text-lime-300 text-xs font-bold flex items-center justify-center">'+(i+1)+'</span>'
      +'<div class="font-semibold text-sm text-zinc-50">'+(s.name||'')+'</div></div>';
    if(s.command){h+='<div class="ml-8 mb-2"><div class="text-[10px] uppercase text-zinc-500 mb-1">执行命令</div><pre class="text-xs bg-zinc-950 text-emerald-300 rounded-lg p-2.5 overflow-x-auto whitespace-pre-wrap font-mono">'+escapeHtml(s.command)+'</pre></div>'}
    if(s.expected_output){h+='<div class="ml-8 mb-2 text-xs"><span class="text-zinc-500">预期输出：</span><span class="text-zinc-400">'+escapeHtml(s.expected_output)+'</span></div>'}
    if(s.knowledge_text){h+='<div class="ml-8 text-xs"><span class="text-cyan-400">知识点：</span><span class="text-zinc-400">'+escapeHtml(s.knowledge_text)+'</span></div>'}
    h+='</div>';
  });
  body.innerHTML=h;
  modal.classList.remove('hidden');
}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function deleteCourse(cid,btn){
  var card=btn.closest('[data-cname]');var cname=card?card.dataset.cname:'该课程';
  if(!confirm('确定删除课程「'+cname+'」？\n将级联清理子任务、进度、对话、报告等数据，不可恢复。'))return;
  try{await apiFetch('/courses/'+cid,{method:'DELETE'});toast('课程已删除','success');loadCourses();}
  catch(e){toast('删除失败: '+e.message,'error');}
}

// === CREATE COURSE ===
// === Course Creation (AI) ===
function my_closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function showCreateCourse() { document.getElementById('modal-course').classList.remove('hidden'); }
function showAiGenerate() { document.getElementById('modal-course').classList.remove('hidden'); }

var _aiFile = null;
function ai_onFileChange(input) { _aiFile = input.files[0]; document.getElementById('ai-file-name').innerText = _aiFile ? _aiFile.name : '未选择文件'; }

async function aiGenerateCourse() {
  var prompt = document.getElementById('input-ai-prompt').value.trim();
  if (!prompt) return;
  var btn = document.getElementById('btn-ai-generate');
  btn.disabled = true; btn.innerHTML = '<div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> 生成中...';
  try {
    var t = localStorage.getItem('datatutor_token');
    var r = await fetch('/api/ai/generate-course', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t, 'Content-Type':'application/json' }, body: JSON.stringify({prompt: prompt}) });
    if (!r.ok) { var e = await r.json().catch(function(){}); throw new Error((e&&e.error)||'AI 服务异常'); }
    var data = await r.json();
    document.getElementById('input-course-name').value = data.name || '';
    document.getElementById('input-course-desc').value = data.description || '';
    if (data.subtasks && data.subtasks.length > 0) {
      var box = document.getElementById('ai-preview-box');
      var content = document.getElementById('ai-preview-content');
      var h = '<div class="font-semibold text-sm mb-2 text-cyan-300">生成子任务 ('+data.subtasks.length+'项)：</div>';
      data.subtasks.forEach(function(s,i){ h += '<div class="text-xs text-zinc-400 py-1 border-b border-white/5 last:border-0">'+(i+1)+'. '+s.name+' <code class="text-[10px] bg-zinc-800 px-1 rounded font-mono">'+(s.command||'')+'</code></div>'; });
      content.innerHTML = h; box.classList.remove('hidden');
    }
  } catch(e) { alert('AI 生成失败: ' + e.message); }
  btn.disabled = false; btn.innerHTML = '<iconify-icon icon="lucide:sparkles"></iconify-icon> AI 生成实训大纲';
}

async function my_saveCourse() {
  var name = document.getElementById('input-course-name').value.trim();
  var desc = document.getElementById('input-course-desc').value.trim();
  var pub = document.getElementById('input-is-public').checked;
  if (!name) return;
  // Collect subtasks from AI preview
  var subtasks = [];
  var preview = document.getElementById('ai-preview-content');
  if (preview && preview.children.length > 0) {
    var items = preview.querySelectorAll('div.text-xs');
    items.forEach(function(item) {
      var txt = item.textContent.replace(/^\d+\.\s*/, '').trim();
      if (txt) subtasks.push({name: txt, command: ''});
    });
  }
  await apiFetch('/courses', { method: 'POST', body: JSON.stringify({ name: name, description: desc, is_public: pub, subtasks: subtasks }) });
  my_closeModal('modal-course'); loadCourses();
}

// === TEACHERS ===// === TEACHERS ===
async function loadTeachers(){
  var q=document.getElementById('teacher-search').value.trim();
  var r=await apiFetch('/courses/admin/teachers'+(q?'?q='+encodeURIComponent(q):''));
  var ts=Array.isArray(r)?r:(r.teachers||[]);
  var h='<table class="w-full text-sm"><thead><tr class="bg-zinc-800/50"><th class="p-3 text-left text-zinc-400">工号</th><th class="p-3 text-left text-zinc-400">姓名</th><th class="p-3 text-left text-zinc-400">班级</th><th class="p-3 text-left text-zinc-400">课程</th></tr></thead><tbody>';
  ts.forEach(function(t){h+='<tr class="border-t border-white/5 text-zinc-300"><td class="p-3 font-mono text-xs">'+(t.teacher_id||'-')+'</td><td class="p-3">'+t.display_name+'</td><td class="p-3">'+t.class_count+'</td><td class="p-3">'+t.course_count+'</td></tr>'});
  h+='</tbody></table>';document.getElementById('teacher-list').innerHTML=h;
}
</script>
<!-- Subtasks Detail Modal -->
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" id="modal-subtasks" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="bg-zinc-900 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl border border-white/10" onclick="event.stopPropagation()">
    <div class="flex-none p-6 border-b border-white/10 flex items-center justify-between">
      <h3 class="font-bold text-zinc-50 text-lg" id="subtasks-title">子任务</h3>
      <button class="text-zinc-500 hover:text-zinc-200" onclick="document.getElementById('modal-subtasks').classList.add('hidden')"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6" id="subtasks-body"></div>
  </div>
</div>
<div class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" id="modal-course" onclick="my_closeModal('modal-course')">
  <div class="bg-zinc-900 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl border border-white/10" onclick="event.stopPropagation()">
    <div class="flex-none p-6 border-b border-white/10 flex items-center justify-between">
      <h3 class="font-bold text-zinc-50 text-lg">创建实训课程</h3>
      <button class="text-zinc-500 hover:text-zinc-200" onclick="my_closeModal('modal-course')"><iconify-icon class="text-xl" icon="lucide:x"></iconify-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-6 space-y-5">
      <div class="bg-cyan-400/5 rounded-xl p-5 border border-cyan-400/20">
        <div class="flex items-center justify-between mb-3"><div class="flex items-center gap-2"><iconify-icon class="text-cyan-400" icon="lucide:sparkles"></iconify-icon><span class="text-sm font-bold text-cyan-300">AI 辅助生成</span></div>
        </div>
        <p class="text-xs text-cyan-300/80 mb-3">描述实训任务，AI 自动填充课程名称、简介和子任务。</p>
        <textarea class="w-full px-3 py-2.5 bg-zinc-900 border border-cyan-400/20 rounded-xl text-sm text-zinc-50 placeholder-zinc-500 focus:border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400/20 resize-none" id="input-ai-prompt" placeholder="例如：利用Hive对淘宝用户日志进行多维度分析" rows="2"></textarea>
        <div class="flex items-center gap-2 mt-2">
          <input type="file" id="input-ai-file" class="hidden" onchange="ai_onFileChange(this)">
          <button class="px-3 py-1.5 text-xs text-amber-400 bg-amber-400/10 border border-amber-400/20 rounded-full hover:bg-amber-400/20 transition" onclick="document.getElementById('input-ai-file').click()"><iconify-icon icon="lucide:file-up" class="mr-1 align-middle"></iconify-icon>上传数据文件</button>
          <span class="text-xs text-zinc-500" id="ai-file-name">未选择文件</span>
        </div>
        <button class="mt-3 w-full py-2.5 bg-lime-400 text-zinc-950 text-sm font-semibold rounded-full hover:bg-lime-300 flex items-center justify-center gap-2 transition" id="btn-ai-generate" onclick="aiGenerateCourse()"><iconify-icon icon="lucide:sparkles"></iconify-icon> AI 生成实训大纲</button>
        <div class="hidden mt-3 bg-zinc-950/60 rounded-xl border border-white/10 p-4 max-h-60 overflow-y-auto" id="ai-preview-box"><div class="text-xs text-zinc-400 leading-relaxed" id="ai-preview-content"></div></div>
      </div>
      <div class="border-t border-white/5"></div>
      <div><label class="block text-sm font-semibold text-zinc-300 mb-1">课程名称 <span class="text-rose-400">*</span></label><input class="w-full px-3 py-2.5 bg-zinc-900 border border-white/10 rounded-xl text-sm text-zinc-50 placeholder-zinc-500 focus:border-lime-400/60 focus:outline-none focus:ring-2 focus:ring-lime-400/20" id="input-course-name" placeholder="如：Hive 数据分析实战"></div>
      <div><label class="block text-sm font-semibold text-zinc-300 mb-1">课程描述</label><textarea class="w-full px-3 py-2.5 bg-zinc-900 border border-white/10 rounded-xl text-sm text-zinc-50 placeholder-zinc-500 focus:border-lime-400/60 focus:outline-none focus:ring-2 focus:ring-lime-400/20 resize-none" id="input-course-desc" rows="2"></textarea></div>
      <label class="flex items-center gap-2"><input type="checkbox" id="input-is-public" class="rounded accent-lime-400"> <span class="text-sm text-zinc-400">全站公开</span></label>
    </div>
    <div class="flex-none p-4 border-t border-white/10 flex justify-end gap-3">
      <button class="px-4 py-2 text-sm text-zinc-400 hover:bg-white/5 rounded-full transition" onclick="my_closeModal('modal-course')">取消</button>
      <button class="px-4 py-2 bg-lime-400 text-zinc-950 text-sm font-semibold rounded-full hover:bg-lime-300 transition" onclick="my_saveCourse()">保存</button>
    </div>
  </div>
</div>
</body></html>
